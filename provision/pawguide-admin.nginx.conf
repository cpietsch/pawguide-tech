server {
    listen 100.102.208.90:7780;
    server_name _;

    location = / {
        root /var/www/pawguide;
        rewrite ^ /dashboard.html break;
        add_header Cache-Control "no-store";
    }

    location = /command-center {
        root /var/www/pawguide;
        rewrite ^ /dashboard.html break;
        add_header Cache-Control "no-store";
    }

    location = /admin/dashboard.js {
        alias /var/www/pawguide/dashboard.js;
        default_type application/javascript;
        add_header Cache-Control "no-store";
    }

    location = /admin/status/acceptance {
        alias /var/www/pawguide/acceptance.json;
        default_type application/json;
        add_header Cache-Control "no-store";
    }

    location = /admin/status/simulator {
        proxy_pass http://127.0.0.1:17779/socket.io/?EIO=4&transport=polling;
        proxy_connect_timeout 1s;
        proxy_read_timeout 2s;
    }

    location = /admin/status/viewer {
        proxy_pass http://127.0.0.1:9878/;
        proxy_connect_timeout 1s;
        proxy_read_timeout 2s;
    }

    location = /admin/status/x5 {
        proxy_pass http://100.72.30.53:8765/health;
        proxy_connect_timeout 1s;
        proxy_read_timeout 2s;
    }

    # Same-origin browser proxy. Authentication remains end-to-end: nginx does
    # not store a token and forwards the browser's Authorization header.
    location /admin/api/sim/ {
        proxy_pass http://100.72.30.53:8876/;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host 100.72.30.53;
        proxy_connect_timeout 2s;
        proxy_read_timeout 20s;
    }

    location /admin/api/physical/ {
        proxy_pass http://100.72.30.53:8765/;
        # Generated locally from /etc/pawguide/operator.token. The browser
        # never receives or needs to enter the operator credential.
        include /etc/pawguide/nginx-operator-auth.conf;
        proxy_set_header Host 100.72.30.53;
        proxy_connect_timeout 2s;
        proxy_read_timeout 20s;
    }

    location / {
        proxy_pass http://127.0.0.1:17779;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;

        sub_filter_once off;
        sub_filter 'http://localhost:7779' 'http://100.102.208.90:7780';
        sub_filter 'ws://localhost:7779' 'ws://100.102.208.90:7780';
        sub_filter 'http://localhost:9090' 'http://100.102.208.90:9879';
        sub_filter 'localhost%3A9876' '100.102.208.90%3A9879';
    }
}

server {
    listen 100.102.208.90:9879;
    server_name _;

    # Rerun's web application.
    location / {
        proxy_pass http://127.0.0.1:9878;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
    }

    # Rerun's gRPC-web message proxy, kept on the same browser origin.
    location /rerun.sdk_comms.v1alpha1.MessageProxyService/ {
        proxy_pass http://127.0.0.1:9877;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
    }
}
