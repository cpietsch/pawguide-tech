<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PawGuide Simulation</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { overflow: hidden; background: #0a0a0f; }
    body { display: flex; flex-direction: column; color: #dce3ee; font: 13px system-ui; }
    header {
      height: 38px; flex: 0 0 38px; display: flex; align-items: center;
      gap: 18px; padding: 0 14px; background: #111722;
      border-bottom: 1px solid #303642;
    }
    main { display: flex; flex: 1 1 auto; min-height: 0; }
    iframe { border: 0; min-width: 0; }
    #viewer { flex: 1 1 auto; }
    .rail {
      flex: 0 0 clamp(24rem, 32vw, 40rem); min-width: 0;
      display: flex; flex-direction: column;
      border-left: 1px solid #303642;
    }
    #controls {
      flex: 1 1 auto; width: 100%; min-height: 16rem;
    }
    .status::before {
      content: ""; display: inline-block; width: 8px; height: 8px;
      margin-right: 6px; border-radius: 50%; background: #697386;
    }
    .status.ok::before { background: #42d392; }
    .status.fail::before { background: #ff5d68; }
    #acceptance-panel {
      flex: 0 0 auto; max-height: 48%; overflow: auto;
      padding: 12px 14px; background: #0e1420;
      border-bottom: 1px solid #303642;
    }
    .acceptance-heading {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px;
    }
    .acceptance-heading h2 { margin: 0; font-size: 15px; }
    .badge {
      padding: 3px 8px; border-radius: 999px; background: #303846;
      font-size: 11px; font-weight: 700; letter-spacing: .06em;
    }
    .badge.passed { color: #07160f; background: #42d392; }
    .badge.failed { color: #210609; background: #ff5d68; }
    .badge.running { color: #1d1400; background: #ffc857; }
    .acceptance-meta {
      display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 8px 0;
      color: #aab5c5;
    }
    #safety-state.safe { color: #42d392; }
    #safety-state.unsafe { color: #ff5d68; }
    #sequence-list, #evidence-list {
      margin: 8px 0; padding: 0; list-style: none;
    }
    #sequence-list li, #evidence-list li {
      margin: 5px 0; padding-left: 18px; position: relative;
    }
    #sequence-list li::before, #evidence-list li::before {
      content: "○"; position: absolute; left: 0; color: #697386;
    }
    #sequence-list li.passed::before, #evidence-list li.passed::before {
      content: "✓"; color: #42d392;
    }
    #sequence-list li.failed::before, #evidence-list li.failed::before {
      content: "×"; color: #ff5d68;
    }
    #sequence-list li.running::before { content: "●"; color: #ffc857; }
    #acceptance-links { display: flex; gap: 12px; margin-top: 8px; }
    #acceptance-links a { color: #83b7ff; text-decoration: none; }
    #acceptance-message { color: #aab5c5; margin: 8px 0 0; }
  </style>
</head>
<body>
  <header>
    <strong>Pre-hardware simulation</strong>
    <span id="simulator" class="status">Simulator checking</span>
    <span id="viewer-status" class="status">3D viewer checking</span>
    <span id="x5" class="status">X5 checking</span>
  </header>
  <main>
    <iframe id="viewer" title="Live 3D Rerun viewer"></iframe>
    <div class="rail">
      <section id="acceptance-panel" aria-labelledby="acceptance-title">
        <div class="acceptance-heading">
          <h2 id="acceptance-title">Concept acceptance</h2>
          <span id="acceptance-result" class="badge">CHECKING</span>
        </div>
        <div class="acceptance-meta">
          <span id="acceptance-progress">Sequence —</span>
          <span id="acceptance-elapsed">Elapsed —</span>
          <span id="safety-state">Safety —</span>
        </div>
        <ol id="sequence-list" aria-label="Show-sequence steps"></ol>
        <ul id="evidence-list" aria-label="Pass and fail evidence"></ul>
        <p id="acceptance-message">Loading acceptance evidence…</p>
        <div id="acceptance-links">
          <a id="viewer-link" target="_blank" rel="noopener">Open live 3D viewer</a>
          <a id="artifact-link" target="_blank" rel="noopener" hidden>Open evidence JSON</a>
        </div>
      </section>
      <iframe id="controls" src="/command-center" title="Robot controls"></iframe>
    </div>
  </main>
  <script>
    const viewerOrigin = `${location.protocol}//${location.hostname}:9879`;
    const proxyUrl = `rerun+http://${location.hostname}:9879/proxy`;
    document.querySelector("#viewer").src =
      `${viewerOrigin}/?url=${encodeURIComponent(proxyUrl)}`;
    document.querySelector("#viewer-link").href =
      `${viewerOrigin}/?url=${encodeURIComponent(proxyUrl)}`;

    async function probe(id, path, label, validate, json = false) {
      const node = document.querySelector(`#${id}`);
      const started = performance.now();
      try {
        const response = await fetch(path, { cache: "no-store" });
        const body = json ? await response.json() : await response.text();
        if (!response.ok || !validate(body)) throw new Error("unhealthy");
        node.className = "status ok";
        node.textContent = `${label} ${Math.round(performance.now() - started)} ms`;
      } catch (_) {
        node.className = "status fail";
        node.textContent = `${node.dataset.label || id} offline`;
      }
    }

    function refreshStatus() {
      probe("simulator", "/admin/status/simulator", "Simulator", body => body.startsWith("0{"));
      probe("viewer-status", "/admin/status/viewer", "3D viewer", body => body.includes("re_viewer"));
      probe(
        "x5",
        "/admin/status/x5",
        "X5",
        body => body.status === "ok"
          && body.adapter === "dimos_mcp"
          && body.motion_capable === true,
        true
      );
    }
    document.querySelector("#simulator").dataset.label = "Simulator";
    document.querySelector("#viewer-status").dataset.label = "3D viewer";
    document.querySelector("#x5").dataset.label = "X5";
    refreshStatus();
    setInterval(refreshStatus, 5000);
  </script>
  <script src="/admin/dashboard.js"></script>
</body>
</html>
