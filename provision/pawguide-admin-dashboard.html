<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PawGuide Go2 Controller</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      color: #eef4ff; background: #090d14;
      font: 15px system-ui, sans-serif;
    }
    header {
      min-height: 54px; display: flex; align-items: center;
      justify-content: space-between; gap: 16px; padding: 10px 20px;
      background: #111824; border-bottom: 1px solid #2b3545;
    }
    header strong { font-size: 18px; }
    .status::before {
      content: ""; display: inline-block; width: 10px; height: 10px;
      margin-right: 7px; border-radius: 50%; background: #778196;
    }
    .status.ok::before { background: #42d392; }
    .status.fail::before { background: #ff5d68; }
    main { width: min(960px, 100%); margin: 0 auto; padding: 20px; }
    #stop-command {
      width: 100%; min-height: 104px; border: 2px solid #ff6570;
      border-radius: 14px; color: white; background: #bd2633;
      font-size: clamp(28px, 5vw, 46px); font-weight: 850;
      cursor: pointer; box-shadow: 0 8px 30px #780f1a55;
    }
    #stop-command:active { transform: translateY(2px); background: #971d28; }
    #live-state {
      display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px; margin: 16px 0;
    }
    .state {
      padding: 12px; border-radius: 9px; color: #9dacbf;
      background: #111824; border: 1px solid #2b3545;
    }
    .state b { display: block; margin-top: 4px; color: #edf3fc; font-size: 17px; }
    #control-guidance {
      margin: 0 0 16px; padding: 12px 14px; border-radius: 9px;
      background: #172235; border: 1px solid #3a5575;
    }
    #control-guidance.ready {
      color: #b7f7d7; background: #0d271e; border-color: #2b8b63;
    }
    #action-grid {
      display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    #action-grid button {
      min-height: 84px; border: 1px solid #47617f; border-radius: 12px;
      color: #f3f7fd; background: #1b2a3e; padding: 12px;
      font-size: 22px; font-weight: 750; cursor: pointer;
    }
    #action-grid button:hover:not(:disabled) {
      border-color: #83b7ff; background: #223753;
    }
    #action-grid button:active:not(:disabled) { transform: translateY(2px); }
    button:disabled { cursor: wait; opacity: .45; }
    #command-log {
      min-height: 88px; max-height: 150px; overflow: auto;
      margin: 16px 0 0; padding: 12px; white-space: pre-wrap;
      color: #b9c7d9; background: #05080d; border: 1px solid #202937;
      border-radius: 9px; font: 12px ui-monospace, monospace;
    }
    @media (max-width: 620px) {
      main { padding: 12px; }
      #live-state { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      #action-grid { grid-template-columns: 1fr; }
      #action-grid button { min-height: 70px; }
    }
  </style>
</head>
<body>
  <header>
    <strong>PawGuide Go2</strong>
    <span id="x5" class="status">Connecting to X5…</span>
  </header>
  <main>
    <button id="stop-command" type="button">STOP</button>

    <div id="live-state" aria-live="polite">
      <div class="state">Connection<b id="control-connection">connecting…</b></div>
      <div class="state">STOP state<b id="control-stop">—</b></div>
      <div class="state">Heartbeat<b id="control-heartbeat">—</b></div>
      <div class="state">Mission<b id="control-mission">—</b></div>
    </div>

    <p id="control-guidance" aria-live="polite">Connecting to the physical Go2…</p>

    <div id="action-grid">
      <button data-action="stand_up" type="button">Stand</button>
      <button data-action="sit_down" type="button">Sit</button>
      <button data-action="greeting" type="button">Hello</button>
      <button data-action="pause" type="button">Pause</button>
    </div>

    <pre id="command-log" aria-live="polite">Connecting automatically…</pre>
  </main>
  <script src="/admin/dashboard.js?v=kiosk-control-1"></script>
</body>
</html>
