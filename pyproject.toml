[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pawguide"
version = "0.1.0"
description = "On-robot safety gateway and mission supervisor for PawGuide"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "python-socketio[client]>=5.11,<6",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[project.scripts]
pawguide-gateway = "pawguide.app:main"
pawguide-client = "pawguide.client:main"
pawguide-operator = "pawguide.operator:main"
pawguide-acceptance = "pawguide.acceptance:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pawguide"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
